<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Meow Munchies</title>
  <desc id="desc">Miso the café cat beside a warm, playful Meow Munchies wordmark.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff8e8"/><stop offset="1" stop-color="#f2d7ac"/></linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c98155"/><stop offset="1" stop-color="#9a553f"/></linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ee778a"/><stop offset="1" stop-color="#c84867"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfe6cb"/><stop offset="1" stop-color="#79b89c"/></linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffe092"/><stop offset="1" stop-color="#e7a956"/></linearGradient>
    <filter id="lift" x="-20%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#67382d" flood-opacity=".25"/></filter>
    <filter id="soft" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#6d3b31" flood-opacity=".2"/></filter>
  </defs>

  <!-- Miso: a simple original café-cat emblem that stays readable at app-icon scale. -->
  <g filter="url(#lift)" stroke="#6f3d32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 246c-28-33-30-91-7-130l-9-62c-1-9 8-14 16-9l51 35c21-6 44-6 65 0l51-35c8-5 17 0 16 9l-9 62c23 39 21 97-7 130-31 38-136 38-167 0Z" fill="url(#fur)" stroke-width="9"/>
    <path d="m61 62 47 31c-14 8-28 20-37 34Z" fill="#f2a7a1" stroke-width="6"/>
    <path d="m238 62-47 31c14 8 28 20 37 34Z" fill="#a65b43" stroke-width="6"/>
    <path d="m206 81 27-18-5 47c-7-12-14-21-22-29Z" fill="#f2a7a1" stroke="none"/>
    <path d="M80 99c21-22 46-31 73-30-8 22-6 42 5 57-34 5-61-4-78-27Z" fill="url(#caramel)" stroke="none" opacity=".95"/>
    <ellipse cx="110" cy="166" rx="11" ry="14" fill="#60392f" stroke="none"/>
    <ellipse cx="191" cy="166" rx="11" ry="14" fill="#60392f" stroke="none"/>
    <path d="M143 185c5-5 11-5 16 0-1 8-4 12-8 12s-7-4-8-12Z" fill="#d86a71" stroke-width="3"/>
    <path d="M151 198v8m0 0c-9 10-20 9-27 2m27-2c9 10 20 9 27 2" fill="none" stroke-width="5"/>
    <path d="M91 196 43 185m48 26-50 5m170-20 48-11m-48 26 50 5" fill="none" stroke-width="4" opacity=".8"/>
    <circle cx="92" cy="190" r="10" fill="#ef9b9b" stroke="none" opacity=".45"/>
    <circle cx="210" cy="190" r="10" fill="#ef9b9b" stroke="none" opacity=".45"/>
    <path d="M83 248c34 24 101 24 135 0-7 35-128 35-135 0Z" fill="url(#mint)" stroke-width="7"/>
    <path d="M151 259c-17 12-29 26-35 43m35-43c17 12 29 26 35 43" fill="none" stroke-width="8"/>
    <circle cx="151" cy="264" r="8" fill="#f4c85e" stroke-width="4"/>
  </g>

  <!-- Wordmark: clean hierarchy, thick outline and restrained shadow for mobile. -->
  <g font-family="ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',sans-serif" font-weight="950" text-anchor="middle" paint-order="stroke fill" stroke-linejoin="round" filter="url(#soft)">
    <text x="494" y="150" font-size="95" letter-spacing="3" fill="#fff7df" stroke="#6f3d32" stroke-width="13">MEOW</text>
    <text x="488" y="247" font-size="79" letter-spacing="1" fill="url(#berry)" stroke="#6f3d32" stroke-width="13">MUNCHIES</text>
  </g>

  <!-- The cookie seal sits below the wordmark so every letter stays unobstructed. -->
  <g transform="translate(494 326) rotate(6)" filter="url(#soft)" stroke="#6f3d32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-41c23 0 42 18 42 41S23 42 0 42-42 23-42 0-23-41 0-41Z" fill="url(#cookie)" stroke-width="7"/>
    <path d="M-11 8c0-9 5-15 11-15S11-1 11 8c0 8-5 13-11 13S-11 16-11 8Z" fill="#74a181" stroke="none"/>
    <circle cx="-20" cy="-12" r="7" fill="#74a181" stroke="none"/><circle cx="0" cy="-19" r="7" fill="#74a181" stroke="none"/><circle cx="20" cy="-12" r="7" fill="#74a181" stroke="none"/>
    <path d="M29-27c8 8 10 18 8 28" fill="none" stroke="#fff0b5" stroke-width="4" opacity=".8"/>
  </g>
  <path d="M322 326c38 8 75 11 116 12m112 0c43-1 82-5 117-12" fill="none" stroke="#8ebda3" stroke-width="7" stroke-linecap="round" opacity=".65"/>
</svg>
